<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" font-family="Helvetica,Arial,sans-serif">
  <rect width="1500" height="920" fill="#eef1f4"/>

  <!-- ===== APP SCREEN (matches the real AP Control Tower) ===== -->
  <g>
    <!-- top bar -->
    <rect x="20" y="20" width="1020" height="30" fill="#232f3e"/>
    <text x="30" y="40" fill="#fff" font-size="12" font-weight="bold">EBS Finance Assistant <tspan fill="#ff9900">26ai</tspan></text>
    <text x="185" y="40" fill="#9fb0c0" font-size="11">Overview</text>
    <text x="245" y="40" fill="#9fb0c0" font-size="11">Collections</text>
    <rect x="315" y="26" width="102" height="18" rx="3" fill="#34465d"/>
    <text x="322" y="40" fill="#fff" font-size="11">AP Control Tower</text>
    <text x="428" y="40" fill="#9fb0c0" font-size="11">Policy</text>
    <text x="905" y="36" fill="#fff" font-size="9" font-weight="bold" text-anchor="end">Simon Cunningham</text>
    <text x="905" y="47" fill="#ff9900" font-size="8" text-anchor="end">AR + AP Manager</text>
    <text x="1005" y="40" fill="#cdd6df" font-size="9">Sign out</text>

    <!-- KPI cards (5) -->
    <g>
      <rect x="20" y="58" width="150" height="52" fill="#fff" stroke="#e2e7ec"/>
      <text x="30" y="74" fill="#8a939c" font-size="8">Invoices in flight</text>
      <text x="30" y="96" fill="#232f3e" font-size="17" font-weight="bold">15,016</text>
      <rect x="176" y="58" width="150" height="52" fill="#fff" stroke="#e2e7ec"/>
      <text x="186" y="74" fill="#8a939c" font-size="8">Invoices on hold</text>
      <text x="186" y="96" fill="#232f3e" font-size="17" font-weight="bold">2,131</text>
      <rect x="332" y="58" width="150" height="52" fill="#fff" stroke="#e2e7ec"/>
      <text x="342" y="74" fill="#8a939c" font-size="8">Amount on hold</text>
      <text x="342" y="96" fill="#232f3e" font-size="17" font-weight="bold">$439.4M</text>
      <rect x="488" y="58" width="150" height="52" fill="#fff" stroke="#e2e7ec"/>
      <text x="498" y="74" fill="#8a939c" font-size="8">Awaiting approval</text>
      <text x="498" y="96" fill="#232f3e" font-size="17" font-weight="bold">179</text>
      <rect x="644" y="58" width="150" height="52" fill="#fff" stroke="#e2e7ec"/>
      <text x="654" y="74" fill="#8a939c" font-size="8">Unpaid invoice value</text>
      <text x="654" y="96" fill="#232f3e" font-size="17" font-weight="bold">$2352.1M</text>
    </g>

    <!-- AI assistant panel (docked, right) -->
    <rect x="800" y="58" width="240" height="472" fill="#fff" stroke="#e2e7ec"/>
    <rect x="800" y="58" width="240" height="24" fill="#eef2f6"/>
    <rect x="808" y="64" width="12" height="12" rx="2" fill="#ff9900"/>
    <text x="826" y="74" fill="#232f3e" font-size="11" font-weight="bold">AI Assistant</text>
    <circle cx="1028" cy="70" r="4" fill="#1a9e5c"/>
    <rect x="812" y="92" width="216" height="70" rx="6" fill="#f0f3f7"/>
    <text x="820" y="108" fill="#2b343d" font-size="8">Hi Simon — I'm your finance</text>
    <text x="820" y="120" fill="#2b343d" font-size="8">assistant. Ask about receivables,</text>
    <text x="820" y="132" fill="#2b343d" font-size="8">payables, or request an action.</text>
    <text x="820" y="144" fill="#2b343d" font-size="8">Actions run through audited EBS APIs.</text>
    <rect x="852" y="176" width="176" height="30" rx="6" fill="#ff9900"/>
    <text x="1020" y="188" fill="#fff" font-size="8" text-anchor="end">Why is invoice Itela0191</text>
    <text x="1020" y="200" fill="#fff" font-size="8" text-anchor="end">on hold?</text>
    <rect x="812" y="216" width="196" height="54" rx="6" fill="#eef1f4"/>
    <text x="820" y="232" fill="#2b343d" font-size="8">It's on a PRICE hold: invoice</text>
    <text x="820" y="244" fill="#2b343d" font-size="8">unit price is 14% over the PO.</text>
    <text x="820" y="256" fill="#2b343d" font-size="8">That exceeds the 10% tolerance —</text>
    <text x="820" y="268" fill="#2b343d" font-size="8">release needs review.</text>
    <rect x="812" y="496" width="164" height="22" rx="4" fill="#f4f6f8" stroke="#e2e7ec"/>
    <text x="820" y="510" fill="#98a2ac" font-size="8">Ask about AR/AP, or request an action…</text>
    <rect x="982" y="496" width="46" height="22" rx="4" fill="#ff9900"/>
    <text x="1005" y="510" fill="#fff" font-size="8" text-anchor="middle">Send</text>

    <!-- invoice pipeline (6 stages) -->
    <rect x="20" y="120" width="770" height="132" fill="#fff" stroke="#e2e7ec"/>
    <text x="30" y="138" fill="#232f3e" font-size="11" font-weight="bold">Invoice pipeline <tspan fill="#98a2ac" font-size="8">— click a stage to focus the queue</tspan></text>
    <!-- Received -->
    <rect x="34" y="150" width="112" height="78" rx="4" fill="#1a8a4a"/>
    <text x="90" y="196" fill="#fff" font-size="11" text-anchor="middle" font-weight="bold">145,489</text>
    <text x="90" y="244" fill="#4a5560" font-size="8" text-anchor="middle">Received</text>
    <text x="152" y="192" fill="#b3bcc4" font-size="14" text-anchor="middle">›</text>
    <!-- Extracted -->
    <rect x="160" y="150" width="112" height="78" rx="4" fill="#1a8a4a"/>
    <text x="216" y="196" fill="#fff" font-size="11" text-anchor="middle" font-weight="bold">145,489</text>
    <text x="216" y="244" fill="#4a5560" font-size="8" text-anchor="middle">Extracted</text>
    <text x="278" y="192" fill="#b3bcc4" font-size="14" text-anchor="middle">›</text>
    <!-- Matched (held) -->
    <rect x="286" y="153" width="112" height="75" rx="4" fill="#e8971e"/>
    <text x="342" y="196" fill="#fff" font-size="11" text-anchor="middle" font-weight="bold">143,358</text>
    <text x="342" y="244" fill="#4a5560" font-size="8" text-anchor="middle">Matched</text>
    <text x="404" y="188" fill="#c0392b" font-size="8" text-anchor="middle" font-weight="bold">−2,131</text>
    <text x="404" y="200" fill="#b3bcc4" font-size="14" text-anchor="middle">›</text>
    <!-- Approved -->
    <rect x="412" y="150" width="112" height="78" rx="4" fill="#1a8a4a"/>
    <text x="468" y="196" fill="#fff" font-size="11" text-anchor="middle" font-weight="bold">145,310</text>
    <text x="468" y="244" fill="#4a5560" font-size="8" text-anchor="middle">Approved</text>
    <text x="530" y="192" fill="#b3bcc4" font-size="14" text-anchor="middle">›</text>
    <!-- Scheduled -->
    <rect x="538" y="151" width="112" height="77" rx="4" fill="#1a8a4a"/>
    <text x="594" y="196" fill="#fff" font-size="11" text-anchor="middle" font-weight="bold">144,890</text>
    <text x="594" y="244" fill="#4a5560" font-size="8" text-anchor="middle">Scheduled</text>
    <text x="656" y="188" fill="#c0392b" font-size="8" text-anchor="middle" font-weight="bold">−14,417</text>
    <text x="656" y="200" fill="#b3bcc4" font-size="14" text-anchor="middle">›</text>
    <!-- Paid -->
    <rect x="664" y="162" width="112" height="66" rx="4" fill="#c0392b"/>
    <text x="720" y="200" fill="#fff" font-size="11" text-anchor="middle" font-weight="bold">130,473</text>
    <text x="720" y="244" fill="#4a5560" font-size="8" text-anchor="middle">Paid</text>

    <!-- blocked value by hold type -->
    <rect x="20" y="262" width="380" height="180" fill="#fff" stroke="#e2e7ec"/>
    <text x="30" y="280" fill="#232f3e" font-size="10" font-weight="bold">Blocked value by hold type <tspan fill="#98a2ac" font-size="7">— click a bar to filter</tspan></text>
    <text x="30" y="300" fill="#687078" font-size="7">QTY ORD</text><rect x="98" y="294" width="268" height="9" fill="#e8971e"/>
    <text x="30" y="315" fill="#687078" font-size="7">INSUFF FUNDS</text><rect x="98" y="309" width="150" height="9" fill="#7f8c99"/>
    <text x="30" y="330" fill="#687078" font-size="7">TAX VARIANCE</text><rect x="98" y="324" width="60" height="9" fill="#e8971e"/>
    <text x="30" y="345" fill="#687078" font-size="7">LINE VARIANCE</text><rect x="98" y="339" width="34" height="9" fill="#7f8c99"/>
    <text x="30" y="360" fill="#687078" font-size="7">MAX RATE</text><rect x="98" y="354" width="24" height="9" fill="#e8971e"/>
    <text x="30" y="375" fill="#687078" font-size="7">AMOUNT</text><rect x="98" y="369" width="18" height="9" fill="#7f8c99"/>
    <text x="30" y="390" fill="#687078" font-size="7">QUALITY</text><rect x="98" y="384" width="12" height="9" fill="#e8971e"/>
    <text x="30" y="405" fill="#687078" font-size="7">TAX DIFF</text><rect x="98" y="399" width="8" height="9" fill="#7f8c99"/>
    <line x1="98" y1="414" x2="366" y2="414" stroke="#e2e7ec"/>
    <text x="98" y="428" fill="#98a2ac" font-size="6">$0        $200M       $400M       $600M</text>

    <!-- payables aging -->
    <rect x="410" y="262" width="380" height="180" fill="#fff" stroke="#e2e7ec"/>
    <text x="420" y="280" fill="#232f3e" font-size="10" font-weight="bold">Payables aging</text>
    <text x="424" y="300" fill="#98a2ac" font-size="6">$2400M</text>
    <text x="424" y="356" fill="#98a2ac" font-size="6">$1200M</text>
    <text x="440" y="414" fill="#98a2ac" font-size="6">$0</text>
    <line x1="452" y1="410" x2="770" y2="410" stroke="#e2e7ec"/>
    <rect x="556" y="298" width="128" height="112" fill="#c0392b"/>
    <text x="620" y="426" fill="#4a5560" font-size="7" text-anchor="middle">90+ days</text>

    <!-- exception queue -->
    <rect x="20" y="452" width="770" height="78" fill="#fff" stroke="#e2e7ec"/>
    <text x="30" y="470" fill="#232f3e" font-size="10" font-weight="bold">Exception queue <tspan fill="#98a2ac" font-size="7">— ranked by value × age</tspan></text>
    <text x="30" y="483" fill="#98a2ac" font-size="7">Showing 30 of 30 loaded (top by priority).</text>
    <text x="30" y="497" fill="#687078" font-size="8">Invoice        Supplier                     Amount        Hold        Age      Reason</text>
    <line x1="30" y1="502" x2="780" y2="502" stroke="#eef1f4"/>
    <text x="30" y="514" fill="#4a5560" font-size="8">Itela0191    American Telephone &amp; T…   $167.5M</text>
    <rect x="470" y="506" width="46" height="11" rx="5" fill="#d13212"/><text x="493" y="514" fill="#fff" font-size="7" text-anchor="middle">PRICE</text>
    <text x="524" y="514" fill="#4a5560" font-size="8">412d    price variance vs PO</text>
    <text x="700" y="514" fill="#0972d3" font-size="8" font-weight="bold">Why?</text>
    <text x="30" y="526" fill="#4a5560" font-size="8">Itela0190    American Telephone &amp; T…   $145.3M</text>
    <rect x="470" y="518" width="52" height="11" rx="5" fill="#ff9900"/><text x="496" y="526" fill="#fff" font-size="7" text-anchor="middle">QTY REC</text>
    <text x="530" y="526" fill="#4a5560" font-size="8">388d    qty over receipt</text>
    <text x="700" y="526" fill="#0972d3" font-size="8" font-weight="bold">Why?</text>
  </g>

  <!-- screen border -->
  <rect x="20" y="20" width="1020" height="512" fill="none" stroke="#c9d3db" stroke-width="1.5"/>
  <text x="20" y="550" fill="#98a2ac" font-size="9" font-style="italic">AP Control Tower — Oracle 26ai (representative figures from the running app)</text>

  <!-- =================== CALLOUTS =================== -->
  <g>
    <!-- A: KPI strip -->
    <rect x="1060" y="58" width="420" height="72" rx="8" fill="#fff" stroke="#0972d3" stroke-width="1.5"/>
    <circle cx="1080" cy="78" r="11" fill="#0972d3"/><text x="1080" y="83" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">A</text>
    <text x="1098" y="78" fill="#0a4b8c" font-size="12" font-weight="bold">KPI strip — the payables headline</text>
    <text x="1098" y="96" fill="#3a4653" font-size="10">In-flight, on hold (2,131), $ blocked ($439M), awaiting</text>
    <text x="1098" y="110" fill="#3a4653" font-size="10">approval (179) and total unpaid — live from EBS AP.</text>
    <text x="1098" y="124" fill="#8a939c" font-size="9">Read from the XX_P2P_KPI reporting view.</text>
    <path d="M1060 88 L794 88" stroke="#0972d3" stroke-width="1.5" fill="none" marker-end="url(#b)"/>

    <!-- B: pipeline -->
    <rect x="1060" y="150" width="420" height="90" rx="8" fill="#fff" stroke="#e8971e" stroke-width="1.5"/>
    <circle cx="1080" cy="170" r="11" fill="#e8971e"/><text x="1080" y="175" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">B</text>
    <text x="1098" y="170" fill="#8a5000" font-size="12" font-weight="bold">Invoice pipeline — the "blockage" view</text>
    <text x="1098" y="188" fill="#3a4653" font-size="10">Where invoices stall from Received → Paid. Red deltas</text>
    <text x="1098" y="202" fill="#3a4653" font-size="10">show the drop-off (−2,131 held at Match; −14,417 not</text>
    <text x="1098" y="216" fill="#3a4653" font-size="10">yet paid). Click a stage to filter the exception queue.</text>
    <text x="1098" y="232" fill="#8a939c" font-size="9">Green = flowing · amber = held · red = shortfall.</text>
    <path d="M1060 195 L790 195" stroke="#e8971e" stroke-width="1.5" fill="none" marker-end="url(#o)"/>

    <!-- C: hold type -->
    <rect x="1060" y="260" width="420" height="72" rx="8" fill="#fff" stroke="#7f8c99" stroke-width="1.5"/>
    <circle cx="1080" cy="280" r="11" fill="#7f8c99"/><text x="1080" y="285" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">C</text>
    <text x="1098" y="280" fill="#4a5560" font-size="12" font-weight="bold">Blocked value by hold type</text>
    <text x="1098" y="298" fill="#3a4653" font-size="10">Which hold reasons tie up the most cash (QTY ORD leads).</text>
    <text x="1098" y="312" fill="#3a4653" font-size="10">Click a bar to filter the queue to that hold type — tells</text>
    <text x="1098" y="326" fill="#3a4653" font-size="10">you where to focus release effort first.</text>
    <path d="M1060 296 L400 350" stroke="#7f8c99" stroke-width="1.5" fill="none" marker-end="url(#gr2)"/>

    <!-- D: aging -->
    <rect x="1060" y="348" width="420" height="58" rx="8" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
    <circle cx="1080" cy="368" r="11" fill="#c0392b"/><text x="1080" y="373" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">D</text>
    <text x="1098" y="368" fill="#8a1f12" font-size="12" font-weight="bold">Payables aging</text>
    <text x="1098" y="386" fill="#3a4653" font-size="10">Open payables bucketed by age. On this clone the data is</text>
    <text x="1098" y="400" fill="#3a4653" font-size="10">historical, so everything sits in the 90+ days bucket.</text>
    <path d="M1060 376 L790 372" stroke="#c0392b" stroke-width="1.5" fill="none" marker-end="url(#r)"/>

    <!-- E: exception queue -->
    <rect x="1060" y="418" width="420" height="90" rx="8" fill="#fff" stroke="#1a8a4a" stroke-width="1.5"/>
    <circle cx="1080" cy="438" r="11" fill="#1a8a4a"/><text x="1080" y="443" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">E</text>
    <text x="1098" y="438" fill="#146c3f" font-size="12" font-weight="bold">Exception queue — the worklist</text>
    <text x="1098" y="455" fill="#3a4653" font-size="10">Held invoices ranked by $ × age. "Why?" runs a READ-ONLY</text>
    <text x="1098" y="469" fill="#3a4653" font-size="10">diagnosis: reconciles invoice vs PO vs goods-receipt inside</text>
    <text x="1098" y="483" fill="#3a4653" font-size="10">Oracle, checks your tolerance policy, and gives a within-/</text>
    <text x="1098" y="497" fill="#3a4653" font-size="10">outside-policy verdict. A human still approves any release.</text>
    <path d="M1060 460 L790 508" stroke="#1a8a4a" stroke-width="1.5" fill="none" marker-end="url(#g)"/>

    <!-- F: AI assistant -->
    <rect x="1060" y="512" width="420" height="76" rx="8" fill="#fff" stroke="#8c4fff" stroke-width="1.5"/>
    <circle cx="1080" cy="532" r="11" fill="#8c4fff"/><text x="1080" y="537" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">F</text>
    <text x="1098" y="532" fill="#5b2ea6" font-size="12" font-weight="bold">Docked AI Assistant (on every screen)</text>
    <text x="1098" y="550" fill="#3a4653" font-size="10">NL analytics, policy RAG, inline charts, and audited</text>
    <text x="1098" y="564" fill="#3a4653" font-size="10">write-back. "Why?" pushes a diagnosis prompt in here.</text>
    <text x="1098" y="578" fill="#8a939c" font-size="9">Remembers context across turns (AgentCore Memory).</text>
    <path d="M1060 540 L1040 300" stroke="#8c4fff" stroke-width="1.5" fill="none" marker-end="url(#p)"/>
  </g>

  <defs>
    <marker id="b" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0972d3"/></marker>
    <marker id="o" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e8971e"/></marker>
    <marker id="gr2" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7f8c99"/></marker>
    <marker id="r" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#c0392b"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1a8a4a"/></marker>
    <marker id="p" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8c4fff"/></marker>
  </defs>
</svg>
